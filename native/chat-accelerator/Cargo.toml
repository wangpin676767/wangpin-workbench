[package]
name = "wangpin-chat-accelerator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"
serde_json = { version = "1", features = ["raw_value"] }
serde = { version = "1", features = ["derive"] }
zstd = "0.13"
memchr = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
